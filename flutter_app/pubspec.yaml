name: vit_trade_flutter
description: Enterprise Flutter mobile trading app for VitTrade.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Riverpod 3.4.x yêu cầu Dart ^3.12; CI pin Flutter 3.47.2 (Dart 3.13).
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  # Toolchain align 2026-09-10: CI + local đồng pin Flutter 3.47.2 (Dart 3.13)
  # — mở room từ <3.4.0 (DEP-LOCK PR Dependabot #104) lên nhánh 3.4.x.
  flutter_riverpod: ">=3.4.0 <3.5.0"
  dio: ^5.11.1
  # GĐ4-F1: tầng persistence — chỉ được import bên trong lib/core/storage/
  # (guardrail runtime_seams canh); phần còn lại của app đi qua seam
  # KeyValueStore/SecureStore.
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0
  # GĐ4-F8: serialization pilot (ADR-010 — DTO provisional chờ contract ký)
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Nhóm A (2026-09-10): smoke tier vận hành — integration_test/smoke_tablet_test.dart
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # GĐ4-F8: codegen DTO — CI job static kiểm git-diff sạch sau build_runner
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  custom_lint: ^0.8.1
  vittrade_lints:
    path: tool/vittrade_lints
  flutter_launcher_icons: ^0.14.4

# Logo VitTrade "Chart V" (concept C, 2026-09-09) — nguồn sự thật ở
# design/logo/ (SVG master + gen_adaptive_foreground.py). Bản raster launcher
# bỏ glow (vô hình ở size nhỏ); nền iOS đặc, không alpha.
flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#07090D"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/app_icon_foreground.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Black.ttf
          weight: 900
