<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>VitTrade adaptive icon foreground — mark thu về safe-zone 66dp, nền trong suốt</title>
  <defs>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mark gốc có bbox tâm (538,480); scale 0.62 + translate đưa tâm về (512,512)
       để mọi điểm đặc nằm trong vòng tròn safe-zone 66dp/108dp. -->
  <g transform="translate(178.4 214.4) scale(0.62)">
    <line x1="736" y1="350" x2="824" y2="350" stroke="#667085" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <line x1="512" y1="610" x2="512" y2="838" stroke="#E58A00" stroke-width="34" stroke-linecap="round"/>
    <path d="M268 350 L512 720" stroke="#E58A00" stroke-width="98" stroke-linecap="round" fill="none"/>
    <path d="M512 720 L756 256" stroke="#F5A524" stroke-width="98" stroke-linecap="round" fill="none"/>
    <circle cx="811" cy="151" r="96" fill="url(#dotGlow)"/>
    <circle cx="811" cy="151" r="46" fill="#10B981"/>
  </g>
</svg>
