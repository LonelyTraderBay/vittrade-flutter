# CI-D4: cập nhật dependency tự động. Hai hệ sinh thái:
# - pub: flutter_app/pubspec.yaml (grouped minor/patch để đỡ nhiễu PR)
# - github-actions: nâng action đã pin SHA trong .github/workflows/
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/flutter_app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # DEP-LOCK: go_router 18 là major breaking (xử lý lại navigation API)
    # — bump từng cú làm vỡ CI (PR #109). Chặn nhánh major; bump trong batch
    # nâng cấp go_router có chủ đích khi xử lý breaking changes.
    ignore:
      - dependency-name: "go_router"
        versions: [">=18.0.0"]
    groups:
      pub-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
