# CI-D4: cập nhật dependency tự động. Hai hệ sinh thái:
# - pub: flutter_app/pubspec.yaml (grouped minor/patch để đỡ nhiễu PR)
# - github-actions: nâng action đã pin SHA trong .github/workflows/
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/flutter_app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # DEP-LOCK: flutter_riverpod >=3.4.0 cần Dart ^3.12 (Flutter 3.47) —
    # toolchain pin Flutter 3.41.9/Dart 3.11.5, bump này làm pub get fail
    # toàn CI (PR #104). Bỏ ignore khi nâng toolchain lên Dart >=3.12.
    ignore:
      - dependency-name: "flutter_riverpod"
        versions: [">=3.4.0"]
    groups:
      pub-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
